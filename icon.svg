<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- רקע כחול כהה עם פינות מעוגלות -->
  <rect width="512" height="512" rx="100" fill="#0d1a2e"/>

  <!-- שלוש נקודות טיל (גדולה, בינונית, קטנה) — מעל המרכז -->
  <circle cx="295" cy="148" r="26" fill="#5bc8f5"/>
  <circle cx="348" cy="148" r="17" fill="#5bc8f5" opacity="0.65"/>
  <circle cx="388" cy="148" r="11" fill="#5bc8f5" opacity="0.38"/>

  <!-- דוב פינגר — לבן, מודגש -->
  <text
    x="256" y="290"
    font-family="'Arial Hebrew', Arial, sans-serif"
    font-size="108"
    font-weight="700"
    fill="#ffffff"
    text-anchor="middle"
    direction="rtl"
  >דוב פינגר</text>

  <!-- קו מפריד -->
  <rect x="176" y="318" width="160" height="2" fill="rgba(255,255,255,0.2)" rx="1"/>

  <!-- מאמן מנטלי — תכלת, קל -->
  <text
    x="256" y="378"
    font-family="'Arial Hebrew', Arial, sans-serif"
    font-size="58"
    font-weight="300"
    fill="#5bc8f5"
    text-anchor="middle"
    direction="rtl"
  >מאמן מנטלי</text>
</svg>
