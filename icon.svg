<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- רקע -->
  <rect width="512" height="512" rx="100" fill="#0d1a2e"/>

  <!-- שלוש נקודות טיל מעל הטקסט (גדולה, בינונית, קטנה — משמאל לימין בעברית) -->
  <circle cx="220" cy="155" r="22" fill="#5bc8f5" opacity="0.38"/>
  <circle cx="265" cy="155" r="17" fill="#5bc8f5" opacity="0.65"/>
  <circle cx="305" cy="155" r="26" fill="#5bc8f5"/>

  <!-- דוב פינגר — לבן מודגש -->
  <text
    x="256" y="280"
    font-family="Arial, sans-serif"
    font-size="100"
    font-weight="700"
    fill="#ffffff"
    text-anchor="middle"
  >דוב פינגר</text>

  <!-- קו מפריד -->
  <rect x="156" y="308" width="200" height="1.5" fill="rgba(255,255,255,0.25)" rx="1"/>

  <!-- מאמן מנטלי — אפור בהיר -->
  <text
    x="256" y="370"
    font-family="Arial, sans-serif"
    font-size="52"
    font-weight="300"
    fill="rgba(255,255,255,0.5)"
    text-anchor="middle"
  >מאמן מנטלי</text>
</svg>
